<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>칭찬스티커 프롬프트 생성기 ⭐</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #667EEA;
      --radius: 18px;
      --border: #E2E8F0;
      --muted: #718096;
      --text: #2D3748;
      --shadow: 0 2px 20px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #FFF0F5 0%, #E8F4FD 50%, #F0FFF4 100%);
      min-height: 100vh;
      padding: 28px 16px 60px;
      color: var(--text);
    }
    .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    .header { text-align: center; margin-bottom: 8px; }
    .header .star { font-size: 44px; display: block; margin-bottom: 8px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .header h1 { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
    .header p { color: var(--muted); font-size: 13px; margin-top: 6px; }

    .card { background: #fff; border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
    .card-title { font-size: 13px; font-weight: 700; color: #4A5568; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .step { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11px; font-weight: 900; flex-shrink: 0; }

    input[type=text] {
      width: 100%; padding: 11px 14px; border-radius: 12px;
      border: 2px solid var(--border); font-size: 15px;
      font-family: inherit; outline: none; transition: border 0.2s; background: #fff;
    }
    input[type=text]:focus { border-color: var(--accent); }

    .gender-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .gender-btn {
      padding: 11px; border-radius: 12px; border: 2px solid var(--border);
      background: #fff; font-family: inherit; font-size: 14px;
      cursor: pointer; transition: all 0.2s; text-align: center; line-height: 1.5;
    }
    .gender-btn.active { border-color: #4A90D9; background: #EBF4FF; color: #1E40AF; font-weight: 700; }
    .gender-btn small { font-size: 11px; opacity: 0.65; display: block; }

    .color-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .color-chip {
      padding: 7px 12px; border-radius: 20px; border: 2px solid var(--border);
      background: #fff; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 5px; font-family: inherit; transition: all 0.2s;
    }
    .color-chip.active { border-color: #4A90D9; font-weight: 700; }
    .color-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #ccc; flex-shrink: 0; }

    .phrase-list { display: flex; flex-direction: column; gap: 8px; }
    .phrase-btn {
      padding: 10px 16px; border-radius: 12px; border: 2px solid var(--border);
      background: #fff; font-family: inherit; font-size: 14px;
      cursor: pointer; text-align: left; transition: all 0.2s; color: var(--muted);
    }
    .phrase-btn.active { border-color: #9B59B6; background: #F5EEFF; color: #6B21A8; font-weight: 700; }
    .preview-badge {
      margin-top: 10px; padding: 8px 14px; background: #FFFBEB;
      border-radius: 10px; font-size: 13px; color: #92400E; border: 1px dashed #FCD34D;
    }

    .gen-btn {
      padding: 16px; border-radius: 16px; border: none;
      background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
      color: #fff; font-size: 17px; font-weight: 900;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 20px rgba(102,126,234,0.4);
      transition: all 0.2s; width: 100%;
    }
    .gen-btn:hover { transform: translateY(-1px); }

    .result-box { background: #1A202C; border-radius: 16px; padding: 20px; display: none; }
    .result-box.show { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .result-title { color: #68D391; font-weight: 700; font-size: 14px; }
    .copy-btn {
      padding: 6px 14px; border-radius: 8px; border: none;
      background: #4A5568; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .copy-btn.copied { background: #48BB78; }
    .result-text { color: #E2E8F0; font-size: 13px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
    .result-hint { margin-top: 12px; padding: 10px 14px; background: #2D3748; border-radius: 10px; font-size: 12px; color: #A0AEC0; line-height: 1.6; }

    .divider { text-align: center; font-size: 12px; color: #A0AEC0; padding: 4px 0; }
  </style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <span class="star">⭐</span>
    <h1>칭찬스티커 프롬프트 생성기</h1>
    <p>ChatGPT에 붙여넣기용 · 30칸 판 + 얼굴 합성 프롬프트</p>
  </div>

  <!-- 1. 아이 정보 -->
  <div class="card">
    <div class="card-title"><span class="step">1</span> 아이 이름 & 성별</div>
    <input type="text" id="childName" placeholder="아이 이름 (예: 승현, 지우, 하늘)" oninput="updatePreview()" />
    <div class="gender-row">
      <button class="gender-btn active" id="btnBoy" onclick="setGender('boy')">
        👦 남자아이<small>턱시도 정장</small>
      </button>
      <button class="gender-btn" id="btnGirl" onclick="setGender('girl')">
        👧 여자아이<small>공주 드레스</small>
      </button>
    </div>
  </div>

  <!-- 2. 배경 색상 -->
  <div class="card">
    <div class="card-title"><span class="step">2</span> 배경 색상</div>
    <div class="color-row" id="colorRow"></div>
  </div>

  <!-- 3. 문구 -->
  <div class="card">
    <div class="card-title"><span class="step">3</span> 타이틀 문구</div>
    <div class="phrase-list" id="phraseList"></div>
    <div id="customWrap" style="display:none; margin-top:8px;">
      <input type="text" id="customPhrase" placeholder="원하는 문구를 입력하세요" oninput="updatePreview()" />
    </div>
    <div id="previewBadge" class="preview-badge" style="display:none;"></div>
  </div>

  <!-- 4. 캐릭터 설명 -->
  <div class="card">
    <div class="card-title"><span class="step">4</span> 캐릭터 설명</div>
    <input type="text" id="charDesc" placeholder="예: 겨울왕국 엘사, 포켓몬 피카츄, 파란 고래 카툰" />
    <div style="margin-top: 8px; font-size: 12px; color: #A0AEC0; line-height: 1.6;">
      💡 캐릭터 이름을 입력하면 프롬프트에 반영돼요<br>
      캐릭터 이미지는 ChatGPT에 직접 첨부하세요!
    </div>
  </div>

  <!-- Generate -->
  <button class="gen-btn" onclick="generatePrompts()">✨ 프롬프트 2개 생성하기</button>

  <!-- Result 1: 스티커 판 -->
  <div class="result-box" id="resultSticker">
    <div class="result-header">
      <span class="result-title">🗺️ ① 칭찬스티커 판 프롬프트</span>
      <button class="copy-btn" id="copySticker" onclick="copyText('sticker')">📋 복사</button>
    </div>
    <div class="result-text" id="stickerText"></div>
    <div class="result-hint">
      💡 사용법: ChatGPT → DALL-E 탭 → 캐릭터 이미지 📎 첨부 → 위 프롬프트 붙여넣기
    </div>
  </div>

  <!-- Result 2: 얼굴 합성 -->
  <div class="result-box" id="resultFace">
    <div class="result-header">
      <span class="result-title" id="faceTitle">🎭 ② 얼굴 합성 프롬프트</span>
      <button class="copy-btn" id="copyFace" onclick="copyText('face')">📋 복사</button>
    </div>
    <div class="result-text" id="faceText"></div>
    <div class="result-hint" id="faceHint"></div>
  </div>

</div>

<script>
  let gender = 'boy';
  let selectedColor = { label: '스카이 블루', value: 'sky blue', hex: '#AED6F1' };
  let selectedPhraseIdx = 0;

  const COLORS = [
    { label: '스카이 블루', value: 'sky blue', hex: '#AED6F1' },
    { label: '피치 핑크', value: 'peach pink', hex: '#F4A9B0' },
    { label: '민트 그린', value: 'mint green', hex: '#A8E6CF' },
    { label: '라벤더', value: 'lavender', hex: '#C9B8E8' },
    { label: '버터 옐로우', value: 'butter yellow', hex: '#FDE68A' },
  ];

  const PHRASES = [
    n => `${n}이가 달라졌어요`,
    n => `${n}의 칭찬스티커`,
    n => `${n}의 보물상자`,
    () => '__custom__',
  ];
  const PHRASE_LABELS = ['○○이가 달라졌어요', '○○의 칭찬스티커', '○○의 보물상자', '✍️ 직접 입력'];

  window.onload = () => { renderColors(); renderPhrases(); };

  function renderColors() {
    document.getElementById('colorRow').innerHTML = COLORS.map((c, i) => `
      <button class="color-chip ${i===0?'active':''}" id="chip${i}" onclick="setColor(${i})"
        style="${i===0?`background:${c.hex};border-color:#4A90D9;font-weight:700;`:''}">
        <span class="color-dot" style="background:${c.hex}"></span>${c.label}
      </button>`).join('');
  }

  function setColor(idx) {
    selectedColor = COLORS[idx];
    COLORS.forEach((c, i) => {
      const el = document.getElementById(`chip${i}`);
      el.className = 'color-chip' + (i===idx?' active':'');
      el.style.cssText = i===idx ? `background:${c.hex};border-color:#4A90D9;font-weight:700;` : '';
    });
  }

  function renderPhrases() {
    document.getElementById('phraseList').innerHTML = PHRASE_LABELS.map((label, i) => `
      <button class="phrase-btn ${i===0?'active':''}" id="phrase${i}" onclick="setPhrase(${i})">
        ${i < 3 ? PHRASES[i](getName()||'○○') : label}
      </button>`).join('');
  }

  function setPhrase(idx) {
    selectedPhraseIdx = idx;
    PHRASE_LABELS.forEach((_, i) => {
      document.getElementById(`phrase${i}`).className = 'phrase-btn' + (i===idx?' active':'');
    });
    document.getElementById('customWrap').style.display = idx===3 ? 'block' : 'none';
    updatePreview();
  }

  function setGender(g) {
    gender = g;
    document.getElementById('btnBoy').className = 'gender-btn' + (g==='boy'?' active':'');
    document.getElementById('btnGirl').className = 'gender-btn' + (g==='girl'?' active':'');
  }

  function getName() { return document.getElementById('childName').value.trim(); }

  function getFinalPhrase() {
    if (selectedPhraseIdx === 3) return document.getElementById('customPhrase').value.trim() || '아이의 칭찬스티커';
    return PHRASES[selectedPhraseIdx](getName() || '아이');
  }

  function updatePreview() {
    const name = getName();
    [0,1,2].forEach(i => {
      const el = document.getElementById(`phrase${i}`);
      if (el) el.textContent = PHRASES[i](name||'○○');
    });
    const badge = document.getElementById('previewBadge');
    if (name && selectedPhraseIdx !== 3) {
      badge.style.display = 'block';
      badge.innerHTML = `👀 미리보기: <strong>${getFinalPhrase()}</strong>`;
    } else {
      badge.style.display = 'none';
    }
  }

  function generatePrompts() {
    const name = getName();
    if (!name) { alert('아이 이름을 입력해주세요!'); return; }
    const charDesc = document.getElementById('charDesc').value.trim() || '귀여운 캐릭터';

    // ── 스티커 판 프롬프트 ──────────────────────────────
    const stickerPrompt =
`Create a children's praise sticker chart illustration with the following exact specifications:

OVERALL: Portrait orientation (ratio similar to A4), soft ${selectedColor.value} pastel background with a gentle rounded rectangle card shape, flat design style, clean printable quality.

TOP SECTION:
- TOP LEFT: A circular photo frame placeholder — clean white circle with a dashed border and a small camera icon in the center. Label it "PHOTO HERE" in small text below. No face inside.
- TOP RIGHT: An adorable kawaii/chibi storybook-style illustration of "${charDesc}". Match the character's original colors and design features as closely as possible. The character should look cheerful and friendly.

CENTER: Large, bold, playful handwritten-style Korean text: "${getFinalPhrase()}"

BOTTOM 2/3 (Sticker Grid):
- Exactly 30 numbered white circles (sticker slots), numbered 1 through 30
- Arranged in a snake/zigzag path:
  • Row 1: circles 1→10, left to right
  • Row 2: circles 20→11, right to left
  • Row 3: circles 21→30, left to right
- Each circle: empty white, soft drop shadow, ready for stickers
- Small Korean motivational text between rows:
  • "잘 했어요! 👏" after circle 10
  • "최고야! 🌟" after circle 20
  • "이야호! 🎉" at circle 30

DECORATIONS: Scatter small stars ✦, hearts ♥, and sparkles around the card edges, using colors that match the character's palette.

STYLE: Korean children's sticker book aesthetic, flat illustration, soft and pastel, cute and cheerful. No real photographs, no real faces — only the circular placeholder frame.`;

    // ── 얼굴 합성 프롬프트 ──────────────────────────────
    const outfit = gender === 'boy'
      ? 'a smart navy tuxedo suit with a red bow tie and white dress shirt, looking like a little gentleman'
      : 'a beautiful princess ball gown with puffy sleeves, lace details, and a pastel pink or lavender color, looking like a little princess';

    const facePrompt =
`I am attaching a photo of a child named ${name}. Please do the following:

1. Keep ${name}'s face EXACTLY as it appears in the photo — preserve all facial features, skin tone, eye shape, and expression perfectly.
2. Replace ONLY the body and clothing with: ${outfit}.
3. Pose: cheerful, front-facing portrait, slightly angled, as if posing for a cute photo.
4. Style: cute chibi/cartoon illustration style for the body, but keep the face realistic and true to the photo.
5. Composition: circular crop with a clean white or transparent background.
6. The final result should look like an adorable personalized character portrait, suitable for placing on a children's sticker chart.

Important: Do NOT alter the face. Only change the clothing and body style.`;

    document.getElementById('stickerText').textContent = stickerPrompt;
    document.getElementById('faceTitle').textContent = `🎭 ② 얼굴 합성 프롬프트 (${gender==='boy'?'👦 턱시도':'👧 드레스'})`;
    document.getElementById('faceText').textContent = facePrompt;
    document.getElementById('faceHint').innerHTML =
      `💡 사용법: ChatGPT GPT-4o → 📎 ${name} 얼굴 사진 첨부 → 위 프롬프트 붙여넣기`;

    document.getElementById('resultSticker').className = 'result-box show';
    document.getElementById('resultFace').className = 'result-box show';

    setTimeout(() => document.getElementById('resultSticker').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }

  function copyText(type) {
    const textEl = type === 'sticker' ? 'stickerText' : 'faceText';
    const btnEl  = type === 'sticker' ? 'copySticker' : 'copyFace';
    navigator.clipboard.writeText(document.getElementById(textEl).textContent).then(() => {
      const btn = document.getElementById(btnEl);
      btn.textContent = '✅ 복사됨!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '📋 복사'; btn.classList.remove('copied'); }, 2000);
    });
  }
</script>
</body>
</html>
